name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "RED AI" com.redai.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Make app icon from logo in index.html
        continue-on-error: true
        run: |
          npm i sharp @capacitor/assets@3
          cat > icons.js <<'JS'
          const fs = require('fs');
          const sharp = require('sharp');
          const html = fs.readFileSync('index.html', 'utf8');
          const svg = html.match(/const LOGO_SVG = `([\s\S]*?)`;/)[1];
          const fg = svg
            .replace(/<rect[^>]*fill="url\(#bg\)"\/>/, '')
            .replace(/<circle[^>]*fill="url\(#g\)"\/>/, '')
            .replace('</defs>', '</defs><g transform="translate(512 512) scale(0.62) translate(-512 -512)">')
            .replace('</svg>', '</g></svg>');
          fs.mkdirSync('assets', { recursive: true });
          (async () => {
            await sharp(Buffer.from(svg)).resize(1024, 1024).png().toFile('assets/icon-only.png');
            await sharp(Buffer.from(fg)).resize(1024, 1024).png().toFile('assets/icon-foreground.png');
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: '#0a0508' } }).png().toFile('assets/icon-background.png');
          })();
          JS
          node icons.js
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0508' --iconBackgroundColorDark '#0a0508'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RED-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
